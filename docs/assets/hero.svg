<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Chamber-to-feature ALD model: precursor pulse filling deep holes on a wafer, with the supply-limit rule">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#15213a"/></linearGradient>
    <linearGradient id="gas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.05"/></linearGradient>
    <style>
      .t { font-family: -apple-system, Inter, Helvetica, Arial, sans-serif; fill: #e9eef7; }
      .m { font-family: "SF Mono", Menlo, Consolas, monospace; fill: #ffd27f; }
      .dim { fill: #9fb0cc; }
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- showerhead -->
  <rect x="60" y="40" width="520" height="14" rx="3" fill="#3b4a66"/>
  <g fill="#3b4a66"><circle cx="90" cy="47" r="2"/><circle cx="130" cy="47" r="2"/><circle cx="170" cy="47" r="2"/><circle cx="210" cy="47" r="2"/><circle cx="250" cy="47" r="2"/><circle cx="290" cy="47" r="2"/><circle cx="330" cy="47" r="2"/><circle cx="370" cy="47" r="2"/><circle cx="410" cy="47" r="2"/><circle cx="450" cy="47" r="2"/><circle cx="490" cy="47" r="2"/><circle cx="530" cy="47" r="2"/></g>
  <!-- pulse of gas descending -->
  <rect x="60" y="54" width="520" height="120" fill="url(#gas)">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.45;0.6;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <!-- wafer with holes -->
  <rect x="60" y="174" width="520" height="140" fill="#1f2a44"/>
  <g id="holes">
    <!-- each hole: dark slot, coverage fill animates downward; edge holes lag -->
    <g transform="translate(100,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.5;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(160,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.49;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(220,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.48;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(280,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.48;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(340,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.48;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(400,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.49;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(460,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.5;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(520,174)"><rect width="18" height="130" fill="#0b1020"/><rect width="18" height="0" fill="#ffb347"><animate attributeName="height" values="0;0;130;130;130" keyTimes="0;0.1;0.53;0.6;1" dur="6s" repeatCount="indefinite"/></rect></g>
  </g>
  <!-- exhaust breakthrough bar on the right of the chamber -->
  <rect x="590" y="54" width="10" height="260" fill="#0b1020"/>
  <rect x="590" y="314" width="10" height="0" fill="#ff6b6b"><animate attributeName="height" values="0;0;0;200;200;0" keyTimes="0;0.1;0.5;0.58;0.62;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="314;314;314;114;114;314" keyTimes="0;0.1;0.5;0.58;0.62;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="606" y="330" class="t dim" font-size="11">exhaust</text>
  <!-- text block -->
  <text x="660" y="86" class="t" font-size="30" font-weight="700">Supply-limited ALD on patterned wafers</text>
  <text x="660" y="118" class="t dim" font-size="16">A chamber-to-feature digital twin, OpenFOAM + Python, verified against Argonne codes and data</text>
  <text x="660" y="176" class="m" font-size="24">t_pulse ≈ 1.2 (1 + A_wall/A_wafer) N0 / (U c0)</text>
  <text x="660" y="212" class="t" font-size="16">Blank wafer 0.35 s. 3D-NAND wafer 14 s. Same chamber, same recipe.</text>
  <text x="660" y="240" class="t dim" font-size="14">Pressure, gap and carrier flow move uniformity; precursor delivery moves time.</text>
  <text x="660" y="300" class="t dim" font-size="13">Soham Kavathekar · University of Pennsylvania · MIT License</text>
</svg>
