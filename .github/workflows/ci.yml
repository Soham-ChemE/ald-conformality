name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python feature solver and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with its test extras
        run: python -m pip install -e '.[test,crosscheck]'
      - name: Console script works
        run: aldconf rule --x 0.01 --Q 300 --p 300 --T 573.15 --AR 100 --d 100e-9 --density 1.78e13
      - name: Tests (the OpenFOAM regression test and the library tests skip here; the openfoam and library jobs run them)
        run: python -m pytest -q tests -rs

  library:
    name: Kinetics and voxel MC libraries (cmake, ctest, Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: cmake and a C++17 compiler (preinstalled on the GitHub image; apt only as a fallback, with retries)
        run: |
          if ! command -v cmake >/dev/null || ! command -v g++ >/dev/null; then
            for i in 1 2 3 4 5 6; do sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ && break; echo "apt attempt $i failed, retrying in 30 s"; sleep 30; done
          fi
          cmake --version
          g++ --version | head -1
      - name: Configure and build lib/aldkin (shared and static)
        run: |
          cmake -S lib/aldkin -B lib/aldkin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build lib/aldkin/build -j 2
          ls -l lib/aldkin/build/libaldkin.*
      - name: ctest lib/aldkin
        run: ctest --test-dir lib/aldkin/build --output-on-failure
      - name: Configure and build lib/aldmc (3D voxel Monte Carlo, std::thread)
        run: |
          cmake -S lib/aldmc -B lib/aldmc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build lib/aldmc/build -j 2
          ls -l lib/aldmc/build/libaldmc.*
      - name: ctest lib/aldmc
        run: ctest --test-dir lib/aldmc/build --output-on-failure
      - name: Fluent adapter compiles and links against the stub
        run: |
          cd adapters/fluent
          cc -std=c99 -Wall -Wextra -pedantic -I. -I../../lib/aldkin/include -c ald_wall_udf.c -o /tmp/ald_wall_udf.o
          cc -shared -fPIC -I. -I../../lib/aldkin/include ald_wall_udf.c -L../../lib/aldkin/build -laldkin -o /tmp/libudf_check.so
      - name: Install the package and run the binding tests (the voxel MC tests use two threads here)
        env:
          ALDMC_THREADS: "2"
        run: |
          python -m pip install -e '.[test,crosscheck]'
          python -m pytest -q tests/test_aldkin.py tests/test_voxel_mc.py -rs

  openfoam:
    name: OpenFOAM chamber chain and regression
    runs-on: ubuntu-latest
    # OpenCFD's image. Docker Hub has 2512 as its newest tag (no 2606 image); see paper/wp/wp7_ci_docker.md.
    # The image sets no USER (the entrypoint script switches users only when run with -u), so steps run as root,
    # which apt needs; the user library is still placed inside the workspace, not under a home directory.
    container:
      image: opencfd/openfoam-default:2512
      options: --user root
    env:
      ALDCONF_FOAM_USER_DIR: ${{ github.workspace }}/.openfoam-user
      ALDCONF_PYTHON: ${{ github.workspace }}/.venv/bin/python
      ALDCONF_CMAKE: ${{ github.workspace }}/.venv/bin/cmake
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      # The image has no Python. Python comes from actions/setup-python (a GitHub-hosted download) and cmake from
      # PyPI, so the job does not depend on the Ubuntu package mirrors; apt is used only if the image lacks g++,
      # and then with retries (2026-11-11: three runs in a row failed to resolve archive.ubuntu.com on the runner).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 3.12 venv with the package, cmake from PyPI, g++ from the image or apt
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[test,crosscheck]' cmake
          .venv/bin/cmake --version
          if ! command -v g++ >/dev/null; then
            for i in 1 2 3 4 5 6; do apt-get update && apt-get install -y --no-install-recommends g++ && break; echo "apt attempt $i failed, retrying in 30 s"; sleep 30; done
          fi
          g++ --version | head -1
      - name: Build lib/aldkin and lib/aldmc (cmake, ctest) and the boundary-condition adapters (wmake)
        run: bash ./reproduce.sh --build
      - name: Steady flow, regression pulse, regression test
        run: bash ./reproduce.sh --regress
      - name: Full test suite with the regression test active
        run: .venv/bin/python -m pytest -q tests -rs
      - name: Upload solver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfoam-logs
          path: |
            reactor/showerhead_pulse_layout_regress/log.scalarTransportFoam
            reactor/showerhead_steady/log.blockMesh
            reactor/showerhead_steady/log.checkMesh
            reactor/showerhead_steady/log.simpleFoam
            reactor/lib/aldWallKinetics/log.wmake
            lib/aldkin/log.cmake
            lib/aldmc/log.cmake
          if-no-files-found: warn

  pages-check:
    name: Live page assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docs/index.html exists and every local asset it references is present
        run: python tests/test_docs_assets.py
