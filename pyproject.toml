[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aldconf"
version = "0.1.0"
description = "Feature-scale ALD / plasma-ALD conformality model: Knudsen transport, Langmuir kinetics, radical recombination"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Soham Kavathekar"}]
dependencies = ["numpy", "scipy", "matplotlib", "pandas", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
