[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aldconf"
version = "0.9.1"
description = "Feature-scale ALD / plasma-ALD conformality model: Knudsen transport, Langmuir kinetics, radical recombination"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Soham Kavathekar"}]
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "scikit-learn", "openpyxl"]

[project.optional-dependencies]
test = ["pytest"]
crosscheck = ["machball"]

[project.scripts]
aldconf = "aldconf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
